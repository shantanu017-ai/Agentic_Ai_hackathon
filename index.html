<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Praxis is an agentic adaptive tutor for Class 10 Physics: a Qoder Cloud Agent plans each session from a live mastery model, a deterministic verifier gates every plan, and spaced review closes the loop. Includes a teacher reteach agent."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Praxis — Agentic exam prep with a learner model"
    />
    <meta
      property="og:description"
      content="A learner model estimates topic and concept mastery; a Qoder Cloud Agent turns it into a verified study plan; a deterministic verifier rejects anything unsound. Includes a student debrief agent and a teacher reteach agent."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#f7f3ea" />
    <title>Praxis — Adaptive exam prep with a learner model</title>
    <link rel="icon" type="image/svg+xml" href="/mark.svg" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("praxis.theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
